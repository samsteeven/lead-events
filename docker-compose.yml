# Infrastructure de développement et de test : PostgreSQL + Kafka (mode KRaft, sans ZooKeeper).
#   cp .env.example .env
#   docker compose up -d postgres kafka            # infrastructure seule (pour développer ou tester)
#   docker compose up -d --build                   # toute la pile : API, consumer, tableau de bord
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadevents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: leadevents
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadevents -d leadevents"]
      interval: 5s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 8s
      timeout: 8s
      retries: 15

  # Applique les migrations Prisma une fois la base prête, puis s'arrête.
  migrate:
    build:
      context: ./api
      target: migrate
    environment:
      DATABASE_URL: postgresql://leadevents:${POSTGRES_PASSWORD}@postgres:5432/leadevents?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # API HTTP : reçoit le webhook de n8n, publie dans Kafka, sert les statistiques.
  api:
    build:
      context: ./api
      target: runtime
    environment: &app-env
      DATABASE_URL: postgresql://leadevents:${POSTGRES_PASSWORD}@postgres:5432/leadevents?schema=public
      KAFKA_BROKERS: kafka:9092
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?définir WEBHOOK_SECRET dans .env}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?définir DASHBOARD_TOKEN dans .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LEAD_RETENTION_DAYS: ${LEAD_RETENTION_DAYS:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Consumer Kafka (processus séparé de l'API) : calcule les statistiques.
  consumer:
    build:
      context: ./api
      target: runtime
    command: ["node", "dist/consumer.js"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    depends_on:
      - api
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
