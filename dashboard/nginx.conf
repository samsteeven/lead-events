server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # L'API n'est pas exposée directement au navigateur : nginx la relaie sous /api (même origine, pas de CORS).
    # Le nom « api » est résolu à chaque requête (DNS interne de Docker, cache de 5 s) : avec un simple
    # `proxy_pass http://api:3000/`, nginx garderait l'adresse IP du démarrage et renverrait des 502 dès que
    # le conteneur de l'API est recréé (redéploiement).
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri /index.html;
    }
}
